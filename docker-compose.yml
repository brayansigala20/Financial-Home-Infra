
services:
  db:
    image: postgres:15-alpine
    container_name: financial_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: financial_home_db
    ports:
      - "5432:5432"
    volumes:
      # Persistencia en el disco secundario de 500 GB
      - /mnt/data/postgres_data:/var/lib/postgresql/data
    networks:
      - financial-net

  backend:
    dns:
      - 8.8.8.8
      - 1.1.1.1
    build:
      context: ./Financial-Home-Backend
      dockerfile: Dockerfile
    container_name: financial_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:secretpassword@db:5432/financial_home_db?schema=public"
    volumes:
      - ./Financial-Home-Backend:/app
      - /app/node_modules
    networks:
      - financial-net
    depends_on:
      - db

  backend-java:
    build:
      context: ./Financial-Home-Backend-Java
      dockerfile: Dockerfile
    container_name: financial_backend_java
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_URL: "jdbc:postgresql://db:5432/financial_home_db"
      DB_USERNAME: postgres
      DB_PASSWORD: secretpassword
    networks:
      - financial-net
    depends_on:
      - db

  frontend:
    build:
      context: ./Financial-Home
      dockerfile: Dockerfile
    container_name: financial_frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./Financial-Home:/app
      - /app/node_modules
    networks:
      - financial-net
    depends_on:
      - backend

networks:
  financial-net:
    driver: bridge
